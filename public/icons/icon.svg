<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  
  <!-- Location Pin -->
  <g transform="translate(256, 240)">
    <!-- Pin body -->
    <path d="M0,-140 C77.3,-140 140,-77.3 140,0 C140,77.3 0,200 0,200 C0,200 -140,77.3 -140,0 C-140,-77.3 -77.3,-140 0,-140 Z" 
          fill="white" 
          opacity="0.95"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="50" fill="url(#grad)"/>
    
    <!-- Pulse effect circles -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  </g>
</svg>
